name: Build and publish ACRDP

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Source and release tag (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rcN)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  SOURCE_DIR: source
  APP_PROJECT: AcrdpClient/AcrdpClient.csproj

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      android_version_code: ${{ steps.version.outputs.android_version_code }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Validate version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)(-rc([1-9][0-9]{0,2}))?$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rcN without leading zeros (major <= 999, minor/patch <= 99), got: $REQUESTED_TAG" >&2
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          rc=${BASH_REMATCH[5]:-}
          if [[ "$rc" == 999 ]]; then
            echo "RC number must be between 1 and 998; 999 is reserved for the stable APK." >&2
            exit 1
          fi
          android_version_code=$(( major * 10000000 + minor * 100000 + patch * 1000 + ${rc:-999} ))
          if (( android_version_code > 2100000000 )); then
            echo "Android version code exceeds 2100000000 for tag $REQUESTED_TAG." >&2
            exit 1
          fi
          echo "android_version_code=$android_version_code" >> "$GITHUB_OUTPUT"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$REQUESTED_TAG" == *-rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve build targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          matrix='[{"runner":"windows-latest","rid":"win-x64","artifact":"windows-x64","output":"win-x64","no_update":false},{"runner":"windows-latest","rid":"win-arm64","artifact":"windows-arm64","output":"win-arm64","no_update":false},{"runner":"windows-latest","rid":"win-x64","artifact":"windows-x64-no-update","output":"win-x64-no-update","no_update":true},{"runner":"windows-latest","rid":"win-arm64","artifact":"windows-arm64-no-update","output":"win-arm64-no-update","no_update":true},{"runner":"ubuntu-24.04","rid":"linux-x64","artifact":"linux-x64","output":"linux-x64","no_update":false},{"runner":"ubuntu-24.04-arm","rid":"linux-arm64","artifact":"linux-arm64","output":"linux-arm64","no_update":false},{"runner":"ubuntu-24.04","rid":"android-arm64","artifact":"android-arm64","output":"android-arm64","no_update":false},{"runner":"macos-15-intel","rid":"osx-x64","artifact":"macos-x64","output":"osx-x64","no_update":false},{"runner":"macos-15","rid":"osx-arm64","artifact":"macos-arm64","output":"osx-arm64","no_update":false}]'
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Clone private source tag
        shell: pwsh
        env:
          SOURCE_TAG: ${{ needs.prepare.outputs.tag }}
          GITEA_SSH_HOST: ${{ secrets.GITEA_SSH_HOST }}
          GITEA_SSH_HOST_KEY: ${{ secrets.GITEA_SSH_HOST_KEY }}
          GITEA_SSH_PRIVATE_KEY_BASE64: ${{ secrets.GITEA_SSH_PRIVATE_KEY_BASE64 }}
          GITEA_SOURCE_REPOSITORY: ${{ secrets.GITEA_SOURCE_REPOSITORY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredSecrets = @(
            'GITEA_SSH_HOST',
            'GITEA_SSH_HOST_KEY',
            'GITEA_SSH_PRIVATE_KEY_BASE64',
            'GITEA_SOURCE_REPOSITORY'
          )
          foreach ($secretName in $requiredSecrets) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($secretName))) {
              throw "$secretName is empty or unavailable to this workflow."
            }
          }

          $sshDirectory = Join-Path $env:RUNNER_TEMP 'acrdp-ssh'
          New-Item -ItemType Directory -Path $sshDirectory -Force | Out-Null
          try {
            $privateKey = Join-Path $sshDirectory 'id_ed25519'
            $knownHosts = Join-Path $sshDirectory 'known_hosts'
            $privateKeyText = [Text.Encoding]::UTF8.GetString(
              [Convert]::FromBase64String($env:GITEA_SSH_PRIVATE_KEY_BASE64)
            ).Replace("`r`n", "`n").Replace("`r", "`n").Trim() + "`n"
            if (-not $privateKeyText.StartsWith('-----BEGIN OPENSSH PRIVATE KEY-----') -or
                -not $privateKeyText.TrimEnd().EndsWith('-----END OPENSSH PRIVATE KEY-----')) {
              throw 'GITEA_SSH_PRIVATE_KEY_BASE64 must decode to a complete OpenSSH private key.'
            }
            [IO.File]::WriteAllText($privateKey, $privateKeyText, [Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText($knownHosts, "$env:GITEA_SSH_HOST_KEY`n", [Text.UTF8Encoding]::new($false))
            if ($IsWindows) {
              $currentUserSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
              $grant = "*$currentUserSid`:(R)"
              & icacls.exe $privateKey /inheritance:r /grant:r $grant | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Unable to secure the deploy key ACL.' }
            }
            else {
              chmod 600 $privateKey $knownHosts
            }

            & ssh-keygen -y -f $privateKey | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'The decoded deploy key is not a valid private key.' }
            & ssh-keygen -F $env:GITEA_SSH_HOST -f $knownHosts | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'The pinned Gitea host key is invalid.' }

            $env:GIT_SSH_COMMAND = "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=`"$knownHosts`" -i `"$privateKey`""
            # Fetch only the requested tag: multiple tags may point at the same commit.
            git clone --depth 1 --no-tags --branch $env:SOURCE_TAG $env:GITEA_SOURCE_REPOSITORY $env:SOURCE_DIR
            if ($LASTEXITCODE -ne 0) { throw "Unable to clone source tag $env:SOURCE_TAG." }
            $resolvedTag = git -C $env:SOURCE_DIR describe --tags --exact-match HEAD
            if ($LASTEXITCODE -ne 0 -or $resolvedTag -cne $env:SOURCE_TAG) {
              throw "The packaging script would resolve tag '$resolvedTag' instead of '$env:SOURCE_TAG'."
            }
          }
          finally {
            Remove-Item -Recurse -Force $sshDirectory -ErrorAction SilentlyContinue
            Remove-Item Env:GIT_SSH_COMMAND -ErrorAction SilentlyContinue
          }

      - name: Resolve .NET SDK and project
        id: project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $globalJson = Join-Path $env:SOURCE_DIR 'global.json'
          if (Test-Path $globalJson) {
            $sdkVersion = (Get-Content $globalJson -Raw | ConvertFrom-Json).sdk.version
          }
          else {
            $sdkVersion = '10.0.x'
          }
          if ([string]::IsNullOrWhiteSpace($sdkVersion)) { throw 'global.json does not define sdk.version.' }

          $projectPath = Join-Path $env:SOURCE_DIR $env:APP_PROJECT
          if (-not (Test-Path $projectPath -PathType Leaf)) {
            throw "Application project was not found: $env:APP_PROJECT"
          }
          if (-not (Select-String -Path $projectPath -Pattern '<OutputType>\s*(Exe|WinExe)\s*</OutputType>' -Quiet)) {
            throw "Application project is not executable: $env:APP_PROJECT"
          }

          $eazFiles = Get-ChildItem $env:SOURCE_DIR -Recurse -File -Include '*.csproj','*.props','*.targets' | Where-Object {
            Select-String -Path $_.FullName -Pattern 'Eazfuscator' -Quiet
          }
          if (-not $eazFiles) { throw 'No Eazfuscator.NET MSBuild/NuGet integration was found in the source repository.' }

          "sdk_version=$sdkVersion" >> $env:GITHUB_OUTPUT
          "project_path=$((Resolve-Path $projectPath).Path)" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.project.outputs.sdk_version }}

      - name: Set up JDK for Android
        if: matrix.rid == 'android-arm64'
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"

      - name: Install Android build tools
        if: matrix.rid == 'android-arm64'
        working-directory: source/AcrdpClient.Android
        shell: bash
        run: |
          set -euo pipefail
          dotnet workload install android
          dotnet build AcrdpClient.Android.csproj -t:InstallAndroidDependencies -c Release \
            "-p:AndroidSdkDirectory=$ANDROID_HOME" "-p:JavaSdkDirectory=$JAVA_HOME" \
            -p:AcceptAndroidSDKLicenses=True

      - name: Prepare macOS build tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # .NET mutexes require a real directory; Eaz pipe paths must also fit within 104 bytes.
          temporary_directory="$(mktemp -d /private/tmp/acrdp.XXXXXX)"
          chmod 700 "$temporary_directory"
          printf 'TMPDIR=%s\nACRDP_BUILD_TMPDIR=%s\n' \
            "$temporary_directory" "$temporary_directory" >> "$GITHUB_ENV"

          # The tagged packaging script resolves hdiutil through PATH.
          mkdir "$temporary_directory/bin"
          cat > "$temporary_directory/bin/hdiutil" <<'HDIUTIL'
          #!/bin/bash
          set -euo pipefail
          if [[ "${1:-}" != create ]]; then
            exec /usr/bin/hdiutil "$@"
          fi

          error_log="$(mktemp "$ACRDP_BUILD_TMPDIR/hdiutil.XXXXXX")"
          trap 'rm -f -- "$error_log"' EXIT

          for attempt in 1 2 3 4; do
            if LC_ALL=C /usr/bin/hdiutil "$@" 2>"$error_log"; then
              cat "$error_log" >&2
              exit 0
            else
              status=$?
            fi
            cat "$error_log" >&2
            if (( attempt == 4 )) || ! grep -Fxq 'hdiutil: create failed - Resource busy' "$error_log"; then
              exit "$status"
            fi
            delay=$((attempt * 5))
            echo "::warning::hdiutil create reported Resource busy (attempt $attempt/4); retrying in ${delay}s." >&2
            sleep "$delay"
          done
          HDIUTIL
          chmod 700 "$temporary_directory/bin/hdiutil"
          printf '%s\n' "$temporary_directory/bin" >> "$GITHUB_PATH"

      - name: Enable Eazfuscator for CI
        if: matrix.rid != 'android-arm64'
        shell: pwsh
        env:
          EAZFUSCATOR_NET_LICENSE: ${{ secrets.EAZFUSCATOR_NET_LICENSE }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:EAZFUSCATOR_NET_LICENSE)) {
            throw 'EAZFUSCATOR_NET_LICENSE is required for release obfuscation.'
          }

          # Use the same cross-platform NuGet integration on every runner.
          $env:EAZFUSCATOR_NET_HOME = ''
          'EAZFUSCATOR_NET_HOME=' >> $env:GITHUB_ENV
          $projects = @($env:APP_PROJECT, 'CoreLib/CoreLib.csproj')
          foreach ($project in $projects) {
            $projectPath = Join-Path $env:SOURCE_DIR $project
            if (-not (Test-Path $projectPath -PathType Leaf)) {
              throw "Project to obfuscate was not found: $project"
            }
            dotnet add $projectPath package Gapotchenko.Eazfuscator.NET --version 2026.2.329 --no-restore
            if ($LASTEXITCODE -ne 0) { throw "Unable to enable Eazfuscator for $project." }

            $document = [xml](Get-Content $projectPath -Raw)
            $guard = $document.CreateDocumentFragment()
            $guard.InnerXml = @'
          <Target Name="VerifyReleaseObfuscation" AfterTargets="Build" Condition="'$(DesignTimeBuild)' != 'true'">
            <Error Condition="'$(Configuration)' != 'Release'" Text="Release packaging requires the Release configuration." />
            <Error Condition="'$(Eazfuscator_NET_Imported)' != 'true' or '$(EazfuscatorSkipExecution)' == 'true' or '$(_Eazfuscator_NET_ExitCode)' != '0'" Text="Eazfuscator did not complete successfully for $(MSBuildProjectName). Refusing to package unprotected assemblies." />
            <Message Importance="high" Text="Verified Eazfuscator obfuscation: $(MSBuildProjectName)" />
          </Target>
          '@
            [void]$document.DocumentElement.AppendChild($guard)
            $document.Save($projectPath)
          }

      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 was not found' }

          $languageFile = Join-Path (Split-Path $iscc) 'Languages\ChineseSimplified.isl'
          if (-not (Test-Path $languageFile)) {
            New-Item -ItemType Directory -Path (Split-Path $languageFile) -Force | Out-Null
            curl.exe --fail --location --retry 3 --output $languageFile 'https://raw.githubusercontent.com/jrsoftware/issrc/refs/heads/main/Files/Languages/ChineseSimplified.isl'
            if ($LASTEXITCODE -ne 0) { throw "Failed to download ChineseSimplified.isl with exit code $LASTEXITCODE" }
          }
          if (-not (Test-Path $languageFile)) { throw 'Inno Setup ChineseSimplified.isl was not found' }
          if ((Get-Content $languageFile -TotalCount 1) -notmatch 'Inno Setup version .* Chinese Simplified messages') { throw 'Invalid Inno Setup ChineseSimplified.isl' }

      - name: Install Linux packaging tools
        if: runner.os == 'Linux' && matrix.rid != 'android-arm64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ruby-full build-essential rpm
          sudo gem install --no-document fpm

      - name: Build installer packages
        if: matrix.rid != 'android-arm64'
        working-directory: source
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          NO_UPDATE: ${{ matrix.no_update }}
          EAZFUSCATOR_NET_LICENSE: ${{ secrets.EAZFUSCATOR_NET_LICENSE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageOptions = @{
            RuntimeIdentifier = $env:RID
            ArtifactsDirectory = 'artifacts'
          }
          if ($env:NO_UPDATE -eq 'true') { $packageOptions.NoUpdate = $true }
          ./packaging/build-package.ps1 @packageOptions

      - name: Build signed Android APK
        if: matrix.rid == 'android-arm64'
        working-directory: source
        shell: pwsh
        env:
          ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.android_version_code }}
          ACRDP_ANDROID_KEYSTORE_BASE64: ${{ secrets.ACRDP_ANDROID_KEYSTORE_BASE64 }}
          ACRDP_ANDROID_KEY_ALIAS: ${{ secrets.ACRDP_ANDROID_KEY_ALIAS }}
          ACRDP_ANDROID_STORE_PASSWORD: ${{ secrets.ACRDP_ANDROID_STORE_PASSWORD }}
          ACRDP_ANDROID_KEY_PASSWORD: ${{ secrets.ACRDP_ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('ACRDP_ANDROID_KEYSTORE_BASE64', 'ACRDP_ANDROID_KEY_ALIAS', 'ACRDP_ANDROID_STORE_PASSWORD', 'ACRDP_ANDROID_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name is empty or unavailable to this workflow."
            }
          }

          try {
            $keystoreBytes = [Convert]::FromBase64String($env:ACRDP_ANDROID_KEYSTORE_BASE64)
          }
          catch [FormatException] {
            throw 'ACRDP_ANDROID_KEYSTORE_BASE64 must contain a Base64-encoded keystore.'
          }
          Remove-Item Env:ACRDP_ANDROID_KEYSTORE_BASE64

          $keystore = Join-Path $env:RUNNER_TEMP 'acrdp-android.keystore'
          try {
            & install -m 600 /dev/null $keystore
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create the Android signing keystore.' }
            [IO.File]::WriteAllBytes($keystore, $keystoreBytes)
            $env:ACRDP_ANDROID_KEYSTORE = $keystore
            ./packaging/build-package.ps1 -RuntimeIdentifier android-arm64 -ArtifactsDirectory artifacts `
              -AndroidVersionCode ([int]$env:ANDROID_VERSION_CODE)
          }
          finally {
            [IO.File]::Delete($keystore)
          }

      - name: Generate SHA-256 files
        shell: pwsh
        env:
          OUTPUT: ${{ matrix.output }}
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDirectory = Join-Path $env:SOURCE_DIR "artifacts/$env:OUTPUT"
          $packages = @(Get-ChildItem $outputDirectory -File | Where-Object Extension -ne '.sha256')
          if ($packages.Count -eq 0) { throw "No installer packages were created for $env:OUTPUT." }
          foreach ($package in $packages) {
            $hash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText(
              "$($package.FullName).sha256",
              "$hash  $($package.Name)`n",
              [Text.UTF8Encoding]::new($false)
            )
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: source/artifacts/${{ matrix.output }}/*
          if-no-files-found: error

      - name: Clean up macOS temporary directory
        if: ${{ always() && runner.os == 'macOS' && env.ACRDP_BUILD_TMPDIR != '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$ACRDP_BUILD_TMPDIR"

  release:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          release_options=()
          if [[ "$PRERELEASE" == 'true' ]]; then
            release_options+=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes
          fi

          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" dist/* \
              "${release_options[@]}" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          else
            gh release create "$RELEASE_TAG" dist/* \
              "${release_options[@]}" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Publish packages to Linux host
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
          DEPLOY_SSH_PRIVATE_KEY_BASE64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          required_secrets=(
            DEPLOY_SSH_HOST
            DEPLOY_SSH_USER
            DEPLOY_SSH_HOST_KEY
            DEPLOY_SSH_PRIVATE_KEY_BASE64
          )
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "$secret_name is empty or unavailable to this workflow." >&2
              exit 1
            fi
          done

          deploy_port="${DEPLOY_SSH_PORT:-22}"
          if [[ ! "$deploy_port" =~ ^[0-9]+$ ]] || (( deploy_port < 1 || deploy_port > 65535 )); then
            echo "DEPLOY_SSH_PORT must be a valid TCP port." >&2
            exit 1
          fi

          ssh_directory="$RUNNER_TEMP/acrdp-deploy-ssh"
          install -d -m 700 "$ssh_directory"
          private_key="$ssh_directory/id_ed25519"
          known_hosts="$ssh_directory/known_hosts"
          trap 'rm -rf "$ssh_directory"' EXIT

          python3 - "$private_key" <<'PY'
          import base64
          import binascii
          import os
          import pathlib
          import sys

          value = os.environ["DEPLOY_SSH_PRIVATE_KEY_BASE64"].strip()
          if value.startswith("-----BEGIN OPENSSH PRIVATE KEY-----"):
              key = value.encode()
          else:
              try:
                  key = base64.b64decode("".join(value.split()), validate=True)
              except binascii.Error as error:
                  raise SystemExit(
                      "DEPLOY_SSH_PRIVATE_KEY_BASE64 must contain an OpenSSH private key "
                      "or its Base64 encoding."
                  )
          key = key.replace(b"\r\n", b"\n").replace(b"\r", b"\n").strip() + b"\n"
          if (
              not key.startswith(b"-----BEGIN OPENSSH PRIVATE KEY-----\n")
              or not key.endswith(b"\n-----END OPENSSH PRIVATE KEY-----\n")
          ):
              raise SystemExit("The deploy secret does not contain an OpenSSH private key.")
          pathlib.Path(sys.argv[1]).write_bytes(key)
          PY
          printf '%s\n' "$DEPLOY_SSH_HOST_KEY" > "$known_hosts"
          chmod 600 "$private_key" "$known_hosts"
          ssh-keygen -y -f "$private_key" >/dev/null

          mapfile -d '' packages < <(find dist -maxdepth 1 -type f -print0)
          if (( ${#packages[@]} == 0 )); then
            echo 'No release packages were found in dist.' >&2
            exit 1
          fi

          ssh_options=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$known_hosts"
            -i "$private_key"
            -p "$deploy_port"
          )
          remote_directory="/www/wwwroot/accloud/acrdp/$RELEASE_TAG"
          ssh "${ssh_options[@]}" "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "rm -rf -- '$remote_directory' && mkdir -p -- '$remote_directory'"
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes rsync
          fi
          export RSYNC_RSH="ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts -i $private_key -p $deploy_port"
          rsync --archive --delete dist/ \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$remote_directory/"

          if [[ "$PRERELEASE" != 'true' ]]; then
            version="${RELEASE_TAG#v}"
            printf '{"version":"%s"}\n' "$version" > latest.json
            rsync --archive latest.json \
              "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:/www/wwwroot/accloud/acrdp/latest.json.tmp"
            ssh "${ssh_options[@]}" "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
              "mv -f -- '/www/wwwroot/accloud/acrdp/latest.json.tmp' '/www/wwwroot/accloud/acrdp/latest.json'"
          fi

      - name: Send Telegram notification
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          WORKER_DEPLOY_CHAT_ID: ${{ secrets.WORKER_DEPLOY_CHAT_ID }}
          WORKER_DEPLOY_API_KEY: ${{ secrets.WORKER_DEPLOY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WORKER_DEPLOY_CHAT_ID:-}" || -z "${WORKER_DEPLOY_API_KEY:-}" ]]; then
            echo 'WORKER_DEPLOY_CHAT_ID and WORKER_DEPLOY_API_KEY are required.' >&2
            exit 1
          fi

          TAG_MESSAGE=''
          tag_object="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")"
          if [[ "$(jq -r '.object.type' <<< "$tag_object")" == 'tag' ]]; then
            tag_sha="$(jq -r '.object.sha' <<< "$tag_object")"
            TAG_MESSAGE="$(gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq '.message // ""')"
          fi

          run_started_at="$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq '.run_started_at')"
          start_seconds="$(date -d "$run_started_at" +%s)"
          end_seconds="$(date +%s)"
          total_seconds="$((end_seconds - start_seconds))"
          deploy_time="$(date '+%Y-%m-%d %H:%M:%S %Z')"

          MESSAGE="$(printf '提示:\n\nacrdp-client 已经更新到: %s' "$VERSION")"
          if [[ -n "${TAG_MESSAGE:-}" ]]; then
            MESSAGE="$(printf '%s\n%s' "$MESSAGE" "$TAG_MESSAGE")"
          fi
          MESSAGE="$(printf '%s\n当前时间: %s\n共计时长: %ss' "$MESSAGE" "$deploy_time" "$total_seconds")"
          payload="$(printf '%s' "$MESSAGE" | python3 -c 'import json, sys; print(json.dumps({"chat_id": sys.argv[1], "message": sys.stdin.read()}))' "$WORKER_DEPLOY_CHAT_ID")"
          curl --fail-with-body --retry 3 -X POST 'https://worker-deploy.allcloud.top/push_message' \
            -H 'Content-Type: application/json' \
            -H "x-api-key: ${WORKER_DEPLOY_API_KEY}" \
            -d "$payload"
